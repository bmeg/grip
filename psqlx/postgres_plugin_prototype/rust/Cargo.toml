[package]
name = "grip_ext"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pgrx = { version = "0.11", default-features = false, features = ["pg15"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["pg15"]
pg15 = ["pgrx/pg15"]
pg_test = []
